data:
  train_batch_size: 256
  micro_batch_size: null # will be deprecated, use micro_batch_size_per_gpu
  micro_batch_size_per_gpu: 8  # this is also val batch size
  train_files: ~/data/gsm8k/train.parquet
  val_files: ~/data/gsm8k/test.parquet
  # Single-turn settings
  prompt_key: question
  response_key: answer
  prompt_dict_keys: ['question']
  response_dict_keys: ['answer']
  # Multi-turn settings
  multiturn:
    enable: false  # Set to true to use multi-turn dataset
    messages_key: messages  # Key for messages list in multi-turn mode
  max_length: 1024
  truncation: error
  balance_dp_token: False
  chat_template: null
  custom_cls:
    path: null
    name: null

model:
  partial_pretrain: ~/models/gemma-1.1-7b-it
  fsdp_config:
    wrap_policy:
      min_num_params: 0
    cpu_offload: False
    offload_params: False
  external_lib: null
  enable_gradient_checkpointing: False
  trust_remote_code: False
  lora_rank: 0  # Set to positive value to enable LoRA (e.g., 32)
  lora_alpha: 16  # LoRA scaling factor
  target_modules: all-linear  # Target modules for LoRA adaptation
  use_liger: False

optim:
  lr: 1e-5
  betas: [0.9, 0.95]
  weight_decay: 0.01
  warmup_steps_ratio: 0.1
  clip_grad: 1.0
  lr_scheduler: cosine

# New validation configuration
validation:
  batch_size: 128  # Batch size for validation
  enable: true  # Whether to enable generation-based validation
  test_freq: 50  # How often to run validation (in steps)
  val_before_train: false  # Whether to run validation before training starts
  max_new_tokens: 512  # Maximum length for generated outputs
  num_beams: 1  # Number of beams for beam search
  do_sample: true  # Whether to use sampling
  temperature: 0.7  # Sampling temperature
  top_p: 0.8  # Nucleus sampling parameter
  top_k: 20  # Top-k sampling parameter

  reward_fn:
    path: "path/to/reward_functions.py"  # Replace with actual path
    name: "gsm8k_reward"  # Use the GSM8K-specific reward function
    # kwargs:
    #   # Additional arguments if needed
    #   check_reasoning: true  # Example custom parameter

ulysses_sequence_parallel_size: 1
use_remove_padding: False

trainer:
  default_local_dir: /tmp/sft_model
  default_hdfs_dir: hdfs://tmp/experiments/gsm8k/gemma-1.1-7b-it/ # change the hdfs path here
  # resume_path: null
  project_name: gsm8k-sft
  experiment_name: test
  total_epochs: 4
  total_training_steps: null
  logger: ['console', 'wandb']  # Added wandb for better visualization
  seed: 1
  # Added for the validation generations visualization
  log_val_generations: 10  # Number of validation examples to log (0 to disable)
  save_freq: 0  # How often to save checkpoints (in steps)